# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:driverdirectdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
# H2 in-memory dev DB — recreate on every boot so entity changes
# (column drops in particular) materialise cleanly. For a real DB,
# replace with `validate` and use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-32-chars}

# Logging
logging.level.org.springframework.security=DEBUG
